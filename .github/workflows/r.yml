name: R

# Esegue gli script R (PCA, MCA, FAMD, cluster) sui dataset elaborati creati dalle fasi Python 01 e 03.
on:
  push:
    branches: [main]
    paths: ["R/**", "src/**", "scripts/01_prepara_dati.py", "scripts/03_esplorativa.py", "dati/originali/**", ".github/workflows/r.yml"]
  pull_request:
    branches: [main]
    paths: ["R/**", "src/**", "scripts/01_prepara_dati.py", "scripts/03_esplorativa.py", "dati/originali/**", ".github/workflows/r.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analisi-r:
    runs-on: ubuntu-latest
    timeout-minutes: 90   # il K-Mode di klaR (20 avvii) richiede diversi minuti
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installa le dipendenze Python
        run: pip install pandas numpy scipy scikit-learn joblib prince kmodes
      - name: Crea i dataset elaborati (fasi 01 e 03)
        run: |
          python scripts/01_prepara_dati.py
          python scripts/03_esplorativa.py
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Installa i pacchetti R
        run: install.packages(c("dplyr", "FactoMineR", "factoextra", "cluster", "psych", "ggplot2", "klaR"))
        shell: Rscript {0}
      - name: Esegui gli script R
        run: Rscript R/esegui_tutto.R
